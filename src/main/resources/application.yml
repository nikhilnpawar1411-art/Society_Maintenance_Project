server:
  port: 8080

spring:
  application:
    name: society-management

  datasource:
    url: jdbc:h2:mem:societydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace

# JWT Configuration
jwt:
  secret: bhavesh&Nikhil's_societyapplication@2026
  expiration: 86400000   # 1 day (in ms)
